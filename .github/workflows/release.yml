name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, for a dry run
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          # Apple Silicon only. Intel Macs cannot run this binary and are not
          # built for; that platform is served by building from source, which
          # needs nothing but a Rust toolchain.
          - { os: macos-latest, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # A shipped binary should not carry the path it was built from. Without
      # this, every panic location in the program and its dependencies embeds the
      # builder's home directory. Cargo's own `trim-paths` would do this, but it
      # is still unstable, so the flags are passed here where the environment is
      # known.
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin mdlook
        env:
          RUSTFLAGS: >-
            --remap-path-prefix=${{ github.workspace }}=/mdlook
            --remap-path-prefix=${{ runner.temp }}=/tmp
            --remap-path-prefix=/Users/runner=/build
            --remap-path-prefix=/home/runner=/build

      - name: Confirm no build paths survived
        run: |
          binary=target/${{ matrix.target }}/release/mdlook
          if strings -a "$binary" | grep -E '/(home|Users)/runner'; then
            echo "::error::the binary carries the build machine's paths"
            exit 1
          fi

      # Built natively on each platform rather than cross-compiled, so the
      # version that ships is the one that was exercised here.
      - name: Check it runs
        run: |
          binary=./target/${{ matrix.target }}/release/mdlook
          "$binary" --version
          "$binary" --plain --width 80 README.md | head -20
          # A renderer that silently emits nothing would pass every check above.
          lines=$("$binary" --plain --width 80 README.md | wc -l)
          [ "$lines" -gt 50 ] || { echo "::error::rendered only $lines lines"; exit 1; }

      - name: Package
        run: |
          name="mdlook-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/mdlook "dist/$name/"
          cp README.md LICENSE CHANGELOG.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          # Written from inside dist so the file records a bare name. Recorded as
          # "dist/..." it verifies only from the directory above the one it ships
          # in, which is nobody's layout.
          ( cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256" )

      - name: Confirm the checksum verifies where it ships
        run: |
          cd dist
          shasum -a 256 -c "mdlook-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: mdlook-${{ matrix.target }}
          path: dist/*.tar.gz*

  publish:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # Last, and deliberately so: this is the only step in the pipeline that cannot
  # be undone. A crates.io version can be yanked, which hides it from new
  # dependents, but it is never removed and the number is burned forever.
  # Everything reversible — the three binaries, the GitHub release — has already
  # succeeded by the time this runs, so a failure anywhere earlier costs nothing
  # but a re-run.
  crates-io:
    name: crates.io
    needs: publish
    runs-on: ubuntu-latest
    # `workflow_dispatch` is documented as a dry run. It must never reach here.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Confirm the token is configured
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set. Add it under" \
                 "Settings ▸ Secrets and variables ▸ Actions. A token scoped to" \
                 "publish-update for this crate is enough."
            exit 1
          fi

      # The tag is what a human typed and the manifest is what actually gets
      # uploaded. Tagging v0.3.0 with the manifest still at 0.2.0 would either
      # fail confusingly or republish the wrong thing, so they are compared
      # before anything is sent.
      - name: Confirm the tag matches the manifest
        id: version
        run: |
          manifest=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "${{ github.ref_name }}" != "v$manifest" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match Cargo.toml version $manifest"
            exit 1
          fi
          echo "version=$manifest" >> "$GITHUB_OUTPUT"

      # Re-running a release is a normal thing to do when a later step failed,
      # and `cargo publish` treats an existing version as an error. Checking
      # first turns that into a skip, so the workflow is safe to run twice.
      - name: Check whether this version is already on crates.io
        id: registry
        run: |
          # Index layout for a name of four or more characters: first two
          # letters, next two, then the name.
          #
          # A failed fetch falls through to "not published" rather than failing
          # the job: the index 404s for a crate that has never been released, and
          # that must not be the thing that blocks a first release. `cargo` is
          # the authority either way — it refuses a duplicate version itself, so
          # the worst case here is a clearer error one step later.
          index=$(curl -sS -H 'User-Agent: mdlook-release-workflow' \
            https://index.crates.io/md/lo/mdlook || true)
          published=$(printf '%s' "$index" \
            | jq -r --arg v '${{ steps.version.outputs.version }}' \
                'select(.vers == $v) | .vers' 2>/dev/null || true)
          if [ -n "$published" ]; then
            echo "::notice::mdlook $published is already published; skipping"
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # `--locked` so the versions that ship are the ones the test suite ran
      # against, rather than whatever resolves at this moment.
      - name: Publish
        if: steps.registry.outputs.already == 'false'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Confirm it is downloadable
        if: steps.registry.outputs.already == 'false'
        run: |
          version='${{ steps.version.outputs.version }}'
          # The index is what `cargo` reads, so it is what "published" means.
          for _ in $(seq 1 20); do
            if curl -sS -H 'User-Agent: mdlook-release-workflow' \
                 https://index.crates.io/md/lo/mdlook \
                 | jq -e --arg v "$version" 'select(.vers == $v)' > /dev/null; then
              echo "mdlook $version is live on crates.io"
              exit 0
            fi
            sleep 15
          done
          echo "::error::mdlook $version did not appear in the index"
          exit 1
