name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The default token is read-only, and nothing in CI needs more than that.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Warnings are errors in CI and not locally: the point is to keep them out of
  # main without interrupting somebody mid-thought.
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets
      - run: cargo test --all-features

      # The state machine is covered by `cargo test`; this exercises the drawing
      # layer, which needs a real terminal. It also catches the case where the
      # viewer starts up and immediately dies, which no unit test can see.
      - name: Draw a document in a pty
        run: |
          python3 tests/tui_capture.py --rows 30 --cols 90 -- \
            ./target/debug/mdlook tests/corpus/kitchen-sink.md > /tmp/screen.txt
          cat /tmp/screen.txt
          grep -q 'Kitchen Sink' /tmp/screen.txt || {
            echo "::error::the viewer drew nothing recognisable"; exit 1; }

      - name: Search and jump in a pty
        run: |
          python3 tests/tui_capture.py --rows 30 --cols 90 / u s e r -- \
            ./target/debug/mdlook tests/corpus/kitchen-sink.md > /tmp/search.txt
          cat /tmp/search.txt
          grep -q 'matches' /tmp/search.txt || {
            echo "::error::the search results popup did not open"; exit 1; }

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from the manifest
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # Build only: the declared minimum has to compile the program, not the test
      # suite's dependencies, which move faster than we want to track.
      - run: cargo build

  publish-dry-run:
    name: Package for crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Catches an unpublishable manifest here rather than at the moment of
      # release, when the tag has already been pushed.
      - run: cargo publish --dry-run
